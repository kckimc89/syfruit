<body>
<header><div class="head">
<div class="title" id="appTitle">🌎 세계 과일도감</div>
<div class="subtitle">과일을 만나고, 그 과일이 자라는 나라와 세계를 함께 배워요.</div>
<div class="actions"><button class="btn" id="mapBtn">🌍 세계지도 탐험</button>
<button class="btn" id="discoverBtn">🗺️ 새로운 과일 발견</button>
<button class="btn" id="parentBtn">🔒 부모님 모드 · 꺼짐</button>
<button class="btn" id="backupBtn">💾 백업</button>
</div><div id="parentState" class="parent-state offstate"></div>
</div></header>

<main>
<section class="notice" id="daily"></section>
<div class="controls"><input class="search" id="search" placeholder="🔎 과일 이름, 영어 이름, 나라로 찾아보세요"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div id="empty" class="empty" hidden>찾는 과일이 없어요.</div>
</main>

<dialog id="mapDlg"><div class="modal" id="mapBox"></div></dialog>
<dialog id="detailDlg"><div class="modal" id="detail"></div></dialog>
<dialog id="discoverDlg"><div class="modal" id="discoverBox"></div></dialog>
<dialog id="countryDlg"><div class="modal" id="countryBox"></div></dialog>

<dialog id="parentDlg"><div class="modal">
<h2>👨‍👩‍👧 부모님 모드</h2>
<p class="small">도감 이름과 과일 정보를 보완하고, 사진을 관리할 수 있어요.</p>
<label>도감 이름</label><input id="bookName" placeholder="예: 민수의 세계 과일도감">
<label>새 PIN (선택)</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="비워두면 기존 PIN 유지">
<div class="modal-actions"><button class="btn" id="parentClose">닫기</button><button class="btn" id="parentSave">저장</button></div>
</div></dialog>

<dialog id="editDlg"><div class="modal" id="editBox"></div></dialog>
<dialog id="backupDlg"><div class="modal">
<h2>💾 데이터 안전관리</h2>
<p class="small">과일·즐겨찾기·이름·직접 등록한 사진·부모님이 보완한 정보를 하나의 백업 파일로 저장하거나 복원합니다.</p>
<div class="modal-actions">
<button class="btn" id="exportBtn">백업 파일 만들기</button>
<button class="btn" id="importBtn">백업 복원</button>
<button class="btn" id="backupClose">닫기</button>
</div><input type="file" id="file" accept=".json" hidden>
</div></dialog>

<input type="file" id="photoInput" accept="image/*" hidden>

function makeData(){
  state.foods=base.map((f,i)=>({id:"f"+i,name:f[0],en:f[1],emoji:f[2],zone:f[3],region:f[4],countries:f[5],desc:f[6],taste:f[7],climate:f[8],eat:f[9],korea:f[10],korArea:f[11],harvest:f[12],photo:photoMap[f[0]]||"",custom:false}));
}
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putPhoto(id,data){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(data,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getPhoto(id){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readonly");const r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>res(r.result||"");r.onerror=()=>rej(r.error)})}
async function allPhotos(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readonly"),s=tx.objectStore(DB_STORE),out={};const rq=s.openCursor();rq.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
async function clearPhotos(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

function load(){
  const raw=localStorage.getItem(KEY);
  if(raw){try{const x=JSON.parse(raw);state.foods=x.foods||[];state.fav=new Set(x.fav||[]);state.foods.forEach(f=>{if(!f.photo&&photoMap[f.name])f.photo=photoMap[f.name]})}catch(e){makeData()}}
  else makeData();
  document.title=localStorage.getItem(NAMEKEY)||"세계 과일도감";
  parent=localStorage.getItem(PARENTKEY)==="on";
}
function save(){localStorage.setItem(KEY,JSON.stringify({foods:state.foods,fav:[...state.fav]}));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function cats(){return ["전체","열대","온대","아열대·열대","건조·사막","온대·지중해성","⭐ 즐겨찾기"];}
function cardPhoto(f){
  return f.photo
    ? `<img loading="lazy" decoding="async" src="${esc(f.photo)}" alt="${esc(f.name)}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
       <div class="no-photo" style="display:none">📷 사진을 등록해 보세요<br>${esc(f.emoji)}</div>`
    : `<div class="no-photo">📷 아직 사진이 없어요<br><span style="font-size:54px">${esc(f.emoji)}</span></div>`;
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  document.getElementById("chips").innerHTML=cats().map(c=>`<button class="chip ${category===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{category=b.dataset.c;render()});
  let list=state.foods.filter(f=>{
    const match=!q || [f.name,f.en,f.countries,f.region,f.desc,f.korea,f.korArea].join(" ").toLowerCase().includes(q);
    const c=category==="전체"||category==="⭐ 즐겨찾기"||f.zone.includes(category);
    const fav=category!=="⭐ 즐겨찾기"||state.fav.has(f.id);
    return match&&c&&fav;
  });
  document.getElementById("grid").innerHTML=list.map(f=>`
  <article class="card" data-card="${f.id}">
    <div class="fruitpic">${cardPhoto(f)}</div>
    <h3>${esc(f.name)}</h3><div class="en">${esc(f.en)}</div>
    <div class="tags"><span class="tag">🌱 ${esc(f.zone)}</span><span class="tag">🌍 ${esc(f.region)}</span></div>
    <button class="fav ${state.fav.has(f.id)?'on':''}" data-id="${f.id}">${state.fav.has(f.id)?"⭐ 즐겨찾기 해제":"☆ 즐겨찾기 추가"}</button>
  </article>`).join("");
  document.querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();render()});
  document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>openDetail(b.dataset.card));
  document.getElementById("empty").hidden=list.length!==0;
}

async function compressPhoto(file){
  const bitmap = await createImageBitmap(file);
  const maxSide = 800;
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bitmap,0,0,w,h);
  bitmap.close();
  return canvas.toDataURL("image/jpeg",0.78);
}
