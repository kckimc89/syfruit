<body>
<header><div class="head">
<div class="title" id="appTitle">🌎 세계 과일도감</div>
<div class="subtitle">과일을 만나고, 그 과일이 자라는 나라와 세계를 함께 배워요.</div>
<div class="actions"><button class="btn" id="mapBtn">🌍 세계지도 탐험</button>
<button class="btn" id="discoverBtn">🗺️ 새로운 과일 발견</button>
<button class="btn" id="parentBtn">🔒 부모님 모드 · 꺼짐</button>
<button class="btn" id="backupBtn">💾 백업</button>
</div><div id="parentState" class="parent-state offstate"></div>
</div></header>

<main>
<section class="notice" id="daily"></section>
<div class="controls"><input class="search" id="search" placeholder="🔎 과일 이름, 영어 이름, 나라로 찾아보세요"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div id="empty" class="empty" hidden>찾는 과일이 없어요.</div>
</main>

<dialog id="mapDlg"><div class="modal" id="mapBox"></div></dialog>
<dialog id="detailDlg"><div class="modal" id="detail"></div></dialog>
<dialog id="discoverDlg"><div class="modal" id="discoverBox"></div></dialog>
<dialog id="countryDlg"><div class="modal" id="countryBox"></div></dialog>

<dialog id="parentDlg"><div class="modal">
<h2>👨‍👩‍👧 부모님 모드</h2>
<p class="small">도감 이름과 과일 정보를 보완하고, 사진을 관리할 수 있어요.</p>
<label>도감 이름</label><input id="bookName" placeholder="예: 민수의 세계 과일도감">
<label>새 PIN (선택)</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="비워두면 기존 PIN 유지">
<div class="modal-actions"><button class="btn" id="parentClose">닫기</button><button class="btn" id="parentSave">저장</button></div>
</div></dialog>

<dialog id="editDlg"><div class="modal" id="editBox"></div></dialog>
<dialog id="backupDlg"><div class="modal">
<h2>💾 데이터 안전관리</h2>
<p class="small">과일·즐겨찾기·이름·직접 등록한 사진·부모님이 보완한 정보를 하나의 백업 파일로 저장하거나 복원합니다.</p>
<div class="modal-actions">
<button class="btn" id="exportBtn">백업 파일 만들기</button>
<button class="btn" id="importBtn">백업 복원</button>
<button class="btn" id="backupClose">닫기</button>
</div><input type="file" id="file" accept=".json" hidden>
</div></dialog>

<input type="file" id="photoInput" accept="image/*" hidden>

function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putPhoto(id,data){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(data,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getPhoto(id){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readonly");const r=tx.objectStore(DB_STORE).get(id);r.onsuccess=()=>res(r.result||"");r.onerror=()=>rej(r.error)})}
async function allPhotos(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readonly"),s=tx.objectStore(DB_STORE),out={};const rq=s.openCursor();rq.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
async function clearPhotos(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

  let list=state.foods.filter(f=>{
    const match=!q || [f.name,f.en,f.countries,f.region,f.desc,f.korea,f.korArea].join(" ").toLowerCase().includes(q);
    const c=category==="전체"||category==="⭐ 즐겨찾기"||f.zone.includes(category);

  </article>`).join("");
  document.querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();render()});

  document.getElementById("empty").hidden=list.length!==0;

}

let lazyObserver=null;
function setupLazyImages(){
  if(lazyObserver) lazyObserver.disconnect();
  const imgs=[...document.querySelectorAll("img[data-img]")];
  if(!imgs.length)return;
  const loadImg=img=>{
    if(img.dataset.loaded==="1")return;
    const url=img.dataset.img;
    if(!url)return;
    img.dataset.loaded="1";
    img.src=url;
  };
  if("IntersectionObserver" in window){
    lazyObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          loadImg(entry.target);
          lazyObserver.unobserve(entry.target);
        }
      });
    },{rootMargin:"350px 0px"});
    imgs.forEach(img=>lazyObserver.observe(img));
  }else{
    imgs.slice(0,6).forEach(loadImg);
  }
}

function canonicalFruitName(v){

 const hit=all.find(f=>String(f.name).toLowerCase()===q || String(f.en).toLowerCase()===q);
 return hit?hit.name:v.trim();
}

function addDiscovered(name, options={}){
 const clean=String(name||"").trim(); if(!clean)return;
 const existing=state.foods.find(f=>f.name===clean);
 if(existing){
   if(options.returnCountry){
     returnToCountry=options.returnCountry;
     const dlg=document.getElementById("countryDlg"); if(dlg&&dlg.open)dlg.close();
     openDetail(existing.id);
   }else alert(clean+"은(는) 이미 등록되어 있어요.");
   return;
 }
 const x=extra.find(v=>v[0]===clean);
 const b=base.find(v=>v[0]===clean);
 const src=x||b;
 const id="f"+Date.now();
 const known=!!src;
 const en=known?src[1]:"";
 const emoji=known?src[2]:"🍎";
 const zone=known?src[3]:"분류 준비 중";
 const region=known?src[4]:"지역 정보 준비 중";
 const countries=known?src[5]:"생산국 정보 준비 중";
 const desc=known?(b?src[6]:`${clean}는 ${region}에서 알려진 과일이에요. ${en}이라는 영어 이름으로도 불립니다. 재배지역과 품종에 따라 크기·색·맛이 달라질 수 있어요.`):`${clean}은(는) 새로 등록한 과일이에요. 아직 내장 자료가 없는 과일이므로 부모님 모드에서 영어 이름, 지역, 생산국, 맛과 특징 등의 정보를 보완해 주세요.`;
 const taste=known?(b?src[7]:"맛과 식감은 품종, 익은 정도, 재배환경에 따라 달라요."):"맛과 식감 정보를 부모님 모드에서 보완해 주세요.";
 const climate=known?(b?src[8]:"주로 "+zone+" 환경에서 재배됩니다."):"자라는 환경 정보를 부모님 모드에서 보완해 주세요.";
 const eat=known?(b?src[9]:"지역과 품종에 따라 생으로 먹거나 주스·디저트·요리 등에 이용합니다."):"먹는 방법을 부모님 모드에서 보완해 주세요.";
 const korean=known?(b?src[10]:((/한국/.test(src[5])||["금귤","유자","한라봉","비파","매실","무화과"].includes(clean))?"한국 생산: 예":"한국 생산: 확인 필요")):"한국 생산 정보 확인 필요";
 const area=known?(b?src[11]:(/한국/.test(src[5])?"제주·남부 지역 중심(품종·재배방식에 따라 다름)":"주요 상업 생산지가 한국에 있는지 자료 확인 필요")):"부모님 모드에서 생산지역을 보완할 수 있어요.";

 save();

function openCountry(name){
 const x=countryInfo[name]||["정보 준비 중","-","-","과일·농산물","이 나라의 더 자세한 정보를 다음 자료에서 보완할 수 있어요."];
 const registered=new Map(state.foods.map(f=>[f.name,f]));
 const catalog=[];
 base.forEach(v=>catalog.push({name:v[0],en:v[1],emoji:v[2],countries:v[5]}));
 extra.forEach(v=>{if(!catalog.some(c=>c.name===v[0]))catalog.push({name:v[0],en:v[1],emoji:v[2],countries:v[5]})});
 state.foods.forEach(f=>{if(!catalog.some(c=>c.name===f.name))catalog.push({name:f.name,en:f.en,emoji:f.emoji,countries:f.countries})});
 const linked=catalog.filter(f=>String(f.countries||"").split(",").map(v=>v.trim()).includes(name));
 document.getElementById("countryBox").innerHTML=`<h2>🏳️ ${esc(name)}</h2>
 <div class="info">
 <div class="box"><b>📍 위치</b>${esc(x[0])}</div><div class="box"><b>📐 면적</b>${esc(x[1])}</div>
 <div class="box"><b>👥 인구</b>${esc(x[2])}</div><div class="box"><b>🌾 대표 특산품</b>${esc(x[3])}</div>
 <div class="box wide"><b>📚 간단한 역사·특징</b>${esc(x[4])}</div></div>
 <div class="section-title">🍎 이 나라와 연결된 과일 <span class="small">· 회색=등록됨 / 색상=아직 미등록</span></div>
 <div class="tags country-fruit-tags">${linked.map(f=>{const r=registered.get(f.name);return r?`<button class="country-fruit-btn registered" data-countryfruit="${esc(r.id)}">${esc(r.emoji)} ${esc(r.name)} ✓</button>`:`<button class="country-fruit-btn unregistered" data-countryadd="${esc(f.name)}">${esc(f.emoji)} ${esc(f.name)} ＋ 등록</button>`}).join("")||'<span class="small">연결된 과일 정보가 아직 없어요.</span>'}</div>
 <div class="data-note">📚 생산국·한국 재배지역·수확시기는 품종, 기후, 재배방식, 연도에 따라 달라질 수 있어요. 이 도감은 앞으로 공신력 있는 농업·국제통계 자료를 기준으로 항목별 검증·보완해 나가는 것을 목표로 합니다.</div><div class="modal-actions"><button class="btn" id="countryClose">닫기</button></div>`;
 document.getElementById("countryDlg").showModal();
 document.getElementById("countryClose").onclick=()=>document.getElementById("countryDlg").close();
 document.querySelectorAll("[data-countryfruit]").forEach(b=>b.onclick=()=>{const id=b.dataset.countryfruit;returnToCountry=name;document.getElementById("countryDlg").close();openDetail(id)});
 document.querySelectorAll("[data-countryadd]").forEach(b=>b.onclick=()=>addDiscovered(b.dataset.countryadd,{returnCountry:name}));
}
function openParent(){
 if(parent){document.getElementById("bookName").value=localStorage.getItem(NAMEKEY)||"세계 과일도감";document.getElementById("pin").value="";document.getElementById("parentDlg").showModal();return;}
 const p=prompt("부모님 모드 PIN을 입력하세요.");
 const saved=localStorage.getItem(PINKEY)||"1234";
 if(p===saved){parent=true;localStorage.setItem(PARENTKEY,"on");updateParent()}else if(p!==null)alert("PIN이 맞지 않아요.");
}
function updateParent(){
 const b=document.getElementById("parentBtn");b.textContent=parent?"🔓 부모님 모드 · 켜짐":"🔒 부모님 모드 · 꺼짐";
 document.getElementById("parentState").textContent=parent?"현재 부모님 모드가 켜져 있어요.":"현재 부모님 모드가 꺼져 있어요.";
 document.getElementById("parentState").className="parent-state "+(parent?"onstate":"offstate");
}
function openEdit(id){
 const f=state.foods.find(x=>x.id===id);
 document.getElementById("editBox").innerHTML=`<h2>✏️ 과일 정보 수정</h2>

 <label>먹는 방법</label><textarea id="eEat">${esc(f.eat)}</textarea>
 <div class="modal-actions"><button class="btn" id="editCancel">취소</button><button class="btn" id="editSave">저장</button></div>`;

}

function showMapCountry(name,btn){
 const pop=document.getElementById("mapSelected");
 if(!pop)return;
 const stage=document.getElementById("mapStage");
 const sr=stage.getBoundingClientRect(), br=btn.getBoundingClientRect();
 const left=((br.left+br.width/2-sr.left)/sr.width*100).toFixed(2);
 const top=((br.top+br.height/2-sr.top)/sr.height*100).toFixed(2);
 pop.style.left=left+"%";pop.style.top=top+"%";pop.hidden=false;
 pop.innerHTML=`🏳️ ${esc(name)}<button class="btn" data-selected-country="${esc(name)}">나라 자세히 보기</button>`;
 pop.querySelector("[data-selected-country]").onclick=()=>openCountry(name);
}

async function compressPhoto(file){
  const bitmap = await createImageBitmap(file);
  const maxSide = 800;
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bitmap,0,0,w,h);
  bitmap.close();
  return canvas.toDataURL("image/jpeg",0.78);
}
